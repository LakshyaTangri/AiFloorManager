[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-t1"
version = "0.1.0"
description = "Pulse T1 edge platform - privacy control set, sealed pipeline and lifecycle tooling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
t1-sim = "t1.tools.sim:main"
t1-bench = "t1.tools.bench:main"
budget-report = "t1.tools.budget_report:main"
chain-verify = "t1.tools.chain_verify:main"
egress-fuzz = "t1.tools.egress_fuzz:main"
sealed-probe = "t1.tools.sealed_probe:main"
t1-preflight = "t1.tools.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
